name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # build produkcyjny jako osobny etap: błąd kompilacji widać tu, a nie jako "serwer nie wstał" w testach
      - name: Build
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # testy e2e (desktop i mobile) na zamockowanym API, uruchamiane na gotowym buildzie
      - name: E2E
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_PREBUILT: "1"
          NEXT_DIST_DIR: .next-e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7